name: Update crates block

on:
  workflow_dispatch:
  schedule:
    
cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  update-crates:
    runs-on: ubuntu-latest
    steps:
      
name: Checkout
      uses: actions/checkout@v4

      
name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

      
name: Update README crates section
      env:
        CRATES_IO_TOKEN: ${{ secrets.CRATESIO }}
      run: cargo run --manifest-path ".github/scripts/update-crates-readme/Cargo.toml"

      
name: Commit changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: atualiza bloco de crates no README"
        file_pattern: README.md
